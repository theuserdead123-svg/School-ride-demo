:root{--orange:#FF7A00;--yellow:#FFB800;--dark:#0F0F0F;--glass:rgba(255,255,255,0.72);--border:rgba(255,255,255,0.4)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f7f6f2;color:#111;font-family:'Inter',sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:'Plus Jakarta Sans',sans-serif}

/* NAV */
nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:92%;max-width:1100px;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:18px}
.logo{font-weight:800;font-size:20px;letter-spacing:-0.5px}.logo span{color:var(--orange)}
.nav-btn{background:var(--dark);color:white;padding:9px 16px;border-radius:12px;font-size:12px;border:none;font-weight:700;cursor:pointer}

/* HERO */
#hero-canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1}
.hero{position:relative;height:100vh;width:100%;background:radial-gradient(120% 120% at 20% 10%, #fff7e8 0%, #f7f6f2 45%, #e9efff 100%);overflow:hidden}
.hero-content{position:relative;z-index:5;height:100vh;display:flex;align-items:center;padding:0 6%}
.hero-text{max-width:560px}
.badge{display:inline-flex;gap:8px;align-items:center;background:white;padding:6px 12px;border-radius:100px;font-size:11px;font-weight:700;letter-spacing:0.5px;box-shadow:0 6px 20px rgba(0,0,0,0.06)}
.hero-text h1{font-size:clamp(38px,6vw,72px);line-height:0.92;letter-spacing:-2px;margin:18px 0;font-weight:800}
.hero-text h1 span{color:var(--orange)}
.hero-text p{opacity:0.6;font-size:15px;line-height:1.5;max-width:380px;margin-bottom:24px}
.cta-row{display:flex;gap:12px;align-items:center}
.cta-main{background:var(--dark);color:white;padding:14px 22px;border-radius:14px;border:none;font-weight:700;font-size:13px;cursor:pointer;transition:0.2s}
.cta-main:hover{transform:translateY(-2px)}
.cta-sub{font-size:12px;opacity:0.5}

/* SECTIONS */
section{position:relative;z-index:5;padding:80px 6%;max-width:1200px;margin:0 auto}
.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.section-head h2{font-size:clamp(28px,4vw,44px);letter-spacing:-1px;line-height:0.9}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
